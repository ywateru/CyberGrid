[package]
name = "cybergrid-ram-desktop"
version = "0.1.0"
edition = "2021"
[lib]
name = "cybergrid_ram_desktop"
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
cybergrid-sdk = { path = "../../../../sdk-rust" }
workspace-core = { path = "../../workspace-core" }
local-workspace = { path = "../../local-workspace" }
gateway-upstream = { path = "../../gateway-upstream" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
reqwest.workspace = true
sha2 = "0.10"
hex.workspace = true
chrono = "0.4"
futures-util.workspace = true
[dev-dependencies]
axum.workspace = true
tokio-tungstenite.workspace = true
rcgen = "=0.13.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
