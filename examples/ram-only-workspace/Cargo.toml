[workspace]
resolver = "2"
members = ["workspace-core", "local-workspace", "gateway-upstream", "desktop/src-tauri"]
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.9"
hex = "0.4"
subtle = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = "=0.29.0"
