<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>只读管理后台 · CyberGrid</title><link rel="stylesheet" href="/site.css"><script src="/admin/admin.js" defer></script></head><body>
<a class="skip-link" href="#main">跳到主要内容</a><header class="site-header shell"><a class="brand" href="/">CyberGrid</a><nav aria-label="主要导航"><a href="/docs/">文档</a><a href="/#downloads">SDK 下载</a><a href="https://github.com/ywateru/CyberGrid">GitHub</a><a href="/admin/" aria-current="page">管理后台</a><a href="/console/">设备控制台</a></nav></header>
<main id="main" class="admin-main shell"><div class="admin-heading"><div><h1>只读管理后台</h1><p>查看当前协调会话、设备心跳与公开端口。</p></div><div id="admin-actions" hidden><button type="button" id="admin-refresh" class="button secondary">刷新</button><button type="button" id="admin-logout" class="button secondary">退出</button></div></div>
<p class="admin-boundary">在线表示心跳有效，不代表业务 TCP 已建立。回退通道“已公布”仅是协调信息；实际业务连接由 SDK 诊断。</p>
<form id="admin-login" class="admin-login" autocomplete="off"><h2>输入管理密钥</h2><p>使用 owner 配置的独立管理密钥，不是 Logto 登录凭据或代理密钥。密钥仅保存在此页面内存，退出或刷新后重新输入。</p><label for="admin-key">管理密钥 · 32–256 UTF8 字节</label><input id="admin-key" type="password" disabled autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="login-error"><button class="button primary" type="submit">查看协调状态</button><p id="login-error" role="alert"></p></form>
<p id="admin-status" role="status" aria-live="polite"></p><p id="admin-error" class="admin-error" role="alert" hidden></p>
<section id="admin-workspace" hidden aria-label="协调状态"><form id="admin-filters" class="admin-filters"><label for="admin-app">应用 ID<input id="admin-app" type="text" placeholder="全部应用" maxlength="256" autocomplete="off"></label><label for="admin-online">设备心跳<select id="admin-online"><option value="">全部</option><option value="true">在线</option><option value="false">离线</option></select></label><button type="submit" class="button secondary">应用筛选</button></form><div id="admin-snapshot" hidden><p id="admin-sampled" class="admin-sampled"></p><dl id="admin-totals" class="admin-totals"></dl><details class="admin-boot"><summary>协调进程信息</summary><dl><dt>本代 epoch</dt><dd id="admin-epoch"></dd><dt>启动时间</dt><dd id="admin-started"></dd><dt>运行秒数</dt><dd id="admin-uptime"></dd></dl></details><div class="admin-list-heading"><h2>设备与公开端口</h2><p>全局摘要不受下方筛选影响。</p></div><div id="admin-devices"></div><nav class="admin-pagination" aria-label="设备分页"><button type="button" id="admin-prev" class="button secondary">上一页</button><p id="admin-page"></p><button type="button" id="admin-next" class="button secondary">下一页</button></nav></div></section>
</main><footer class="site-footer shell"><a href="/">返回首页</a><p>只读协调信息；不查看业务内容，不修改用户或设备。</p></footer></body></html>
