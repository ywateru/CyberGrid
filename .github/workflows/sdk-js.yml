name: Verify browser SDK

on:
  push:
    paths: ['sdk-js/**', 'server/src/**', 'server/test/fixtures.ts', 'server/package*.json', '.github/workflows/sdk-js.yml']
  pull_request:
    paths: ['sdk-js/**', 'server/src/**', 'server/test/fixtures.ts', 'server/package*.json', '.github/workflows/sdk-js.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Install fixture coordinator dependencies
        working-directory: server
        run: npm ci --include=dev --ignore-scripts
      - name: Build and verify zero-runtime-dependency ESM SDK
        working-directory: sdk-js
        run: |
          npm ci --include=dev --ignore-scripts
          npm test
          npm run test:integration
