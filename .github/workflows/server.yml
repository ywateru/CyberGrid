name: Check Redis coordinator

on:
  push:
    branches: [main]
    paths: ['server/**', 'api/**', 'package.json', 'vercel.json', '.vercelignore', 'scripts/release/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'api/**', 'package.json', 'vercel.json', '.vercelignore', 'scripts/release/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Install isolated Redis test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          command -v redis-server
      - name: Install and build the Function implementation
        run: |
          npm --prefix server ci --include=dev
          npm run build
      - name: Run real Redis and HTTP coordinator tests
        env:
          REQUIRE_REDIS: '1'
        run: npm --prefix server test
      - name: Verify server dependency license texts
        run: python3 scripts/release/collect-server-licenses.py --check
      - name: Verify explicit public-source binary policy
        run: python3 scripts/release/test-source-policy.py
      - name: Verify non-root Docker and Compose Redis persistence
        run: python3 scripts/release/check-docker.py
