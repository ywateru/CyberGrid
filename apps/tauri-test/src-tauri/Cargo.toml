[package]
name = "cybergrid-tauri-lab"
version = "0.2.0"
description = "CyberGrid native Rust SDK two-device test app"
authors = ["CyberGrid"]
edition = "2021"

[features]
default = []
adb-test-control = []

[lib]
name = "cybergrid_tauri_lab"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
cybergrid-sdk = { path = "../../../sdk-rust" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread"] }
tokio-util = "0.7"
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
